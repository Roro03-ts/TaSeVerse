<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaSeVerse — Entre notas e historias</title>

<meta name="description" content="TaSeVerse: una galaxia educativa para aprender inglés mediante juegos, música, cuentos y misiones.">

<style>
:root{
  --bg:#030513;
  --bg2:#070b22;
  --panel:rgba(10,15,43,.82);
  --panel2:rgba(16,22,58,.92);
  --line:rgba(126,151,255,.22);

  --blue:#55d8ff;
  --cyan:#73efff;
  --purple:#a87cff;
  --pink:#ff7fd7;
  --green:#6ff0c1;
  --gold:#ffd76b;

  --white:#f7f8ff;
  --muted:#aeb8d9;

  --shadow:0 24px 80px rgba(0,0,0,.45);
  --glow:0 0 28px rgba(85,216,255,.18);

  --radius:26px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--white);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      rgba(3,5,19,.28),
      rgba(3,5,19,.6)
    ),
    url("assets/space-background.png")
      center top/
      cover fixed,

    radial-gradient(
      circle at 50% 10%,
      #15195b 0,
      #050719 42%,
      #02030d 100%
    );

  overflow-x:hidden;
}

body:before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;
  z-index:-1;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(168,124,255,.13),
      transparent 25%
    ),

    radial-gradient(
      circle at 85% 28%,
      rgba(85,216,255,.11),
      transparent 25%
    ),

    radial-gradient(
      circle at 50% 80%,
      rgba(255,127,215,.08),
      transparent 30%
    );
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

img{
  max-width:100%;
  display:block;
}


/* =========================
   NAVBAR
========================= */

.nav{
  position:fixed;

  z-index:100;

  top:14px;
  left:50%;

  transform:translateX(-50%);

  width:min(
    1180px,
    calc(100% - 28px)
  );

  padding:10px 14px;

  border:1px solid
    rgba(139,161,255,.22);

  border-radius:22px;

  background:
    rgba(4,7,27,.72);

  backdrop-filter:blur(18px);

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.28);
}

.nav-inner{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  font-weight:900;
  letter-spacing:.4px;

  white-space:nowrap;
}

.brand-mark{
  width:38px;
  height:38px;

  border-radius:12px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 0 26px
    rgba(168,124,255,.35);

  color:#060718;

  font-weight:1000;
}

.nav-links{
  display:flex;
  gap:4px;
  align-items:center;

  margin-left:auto;
}

.nav-links a{
  padding:9px 11px;

  border-radius:12px;

  color:var(--muted);

  font-size:.88rem;

  transition:.2s ease;
}

.nav-links a:hover{
  color:var(--white);

  background:
    rgba(255,255,255,.07);
}

.nav-cta{
  padding:10px 15px;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  color:#07091b;

  font-weight:900;

  white-space:nowrap;
}

.nav-toggle{
  display:none;

  background:none;
  border:0;

  color:white;

  font-size:1.4rem;

  cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
  position:relative;

  min-height:100vh;

  padding:
    145px
    6vw
    90px;

  display:flex;
  align-items:center;

  overflow:hidden;
}

.hero-orbit{
  position:absolute;

  inset:10% -10% auto;

  height:720px;

  border:
    1px solid
    rgba(123,144,255,.09);

  border-radius:50%;

  transform:rotate(-8deg);

  pointer-events:none;
}

.space-object{
  position:absolute;

  pointer-events:none;

  user-select:none;
}

.earth{
  width:170px;

  left:2%;
  top:23%;

  animation:
    float 7s ease-in-out infinite;
}

.purple-planet{
  width:145px;

  right:7%;
  top:17%;

  animation:
    float 8s ease-in-out -2s infinite;
}

.pink-planet{
  width:110px;

  right:25%;
  bottom:10%;

  animation:
    float 6s ease-in-out -1s infinite;
}

.orange-planet{
  width:115px;

  left:28%;
  bottom:4%;

  animation:
    float 8s ease-in-out -3s infinite;
}

.moon{
  width:95px;

  right:5%;
  bottom:17%;

  animation:
    float 9s ease-in-out infinite;
}

.rocket-bg{
  width:150px;

  left:7%;
  bottom:8%;

  transform:rotate(-18deg);

  animation:
    rocketFloat 5s ease-in-out infinite;
}

.hero-grid{
  width:min(
    1240px,
    100%
  );

  margin:auto;

  display:grid;

  grid-template-columns:
    1fr
    1.08fr;

  gap:40px;

  align-items:center;

  position:relative;

  z-index:2;
}

.hero-copy{
  max-width:650px;
}

.eyebrow{
  display:inline-flex;

  align-items:center;

  gap:9px;

  padding:8px 13px;

  border-radius:999px;

  background:
    rgba(85,216,255,.08);

  border:
    1px solid
    rgba(85,216,255,.2);

  color:var(--cyan);

  font-weight:800;

  font-size:.78rem;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.hero h1{
  margin:
    18px 0 8px;

  font-size:
    clamp(
      4rem,
      10vw,
      8.2rem
    );

  line-height:.82;

  letter-spacing:-.075em;

  font-weight:1000;

  text-shadow:
    0 0 50px
    rgba(85,216,255,.12);
}

.hero h1 span{
  background:
    linear-gradient(
      90deg,
      var(--blue),
      var(--purple),
      var(--pink)
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.slogan{
  font-size:
    clamp(
      1.05rem,
      2vw,
      1.35rem
    );

  font-weight:800;

  color:#e6e9ff;

  margin:
    20px 0 12px;
}

.lead{
  color:var(--muted);

  font-size:1.03rem;

  line-height:1.75;

  max-width:600px;
}

.hero-actions{
  display:flex;

  flex-wrap:wrap;

  gap:12px;

  margin-top:27px;
}

.btn{
  border:0;

  border-radius:15px;

  padding:
    14px 20px;

  cursor:pointer;

  font-weight:900;

  transition:.22s ease;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  color:#060719;

  box-shadow:
    0 14px 35px
    rgba(85,216,255,.16);
}

.btn:hover{
  transform:translateY(-3px);

  box-shadow:
    0 18px 45px
    rgba(168,124,255,.23);
}

.btn.secondary{
  background:
    rgba(255,255,255,.055);

  color:var(--white);

  border:
    1px solid
    var(--line);

  box-shadow:none;
}

.hero-stats{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:34px;
}

.stat{
  min-width:120px;

  padding:
    12px 14px;

  border-radius:16px;

  background:
    rgba(10,15,43,.62);

  border:
    1px solid
    rgba(126,151,255,.16);
}

.stat strong{
  display:block;

  font-size:1.2rem;
}

.stat span{
  color:var(--muted);

  font-size:.78rem;
}


/* =========================
   HERO ART
========================= */

.hero-art{
  position:relative;

  min-height:560px;

  display:grid;

  place-items:center;
}

.hero-art:before{
  content:"";

  position:absolute;

  width:76%;
  height:76%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(90,154,255,.2),
      rgba(168,124,255,.08) 45%,
      transparent 70%
    );

  filter:blur(14px);
}

.main-art{
  position:relative;

  width:min(
    650px,
    100%
  );

  filter:
    drop-shadow(
      0 28px 45px
      rgba(0,0,0,.5)
    );

  animation:
    heroFloat 6s ease-in-out infinite;
}

.art-tag{
  position:absolute;

  right:0;
  bottom:7%;

  max-width:230px;

  padding:
    16px 18px;

  border-radius:19px;

  background:
    rgba(5,8,29,.84);

  border:
    1px solid
    rgba(126,151,255,.25);

  backdrop-filter:blur(14px);

  box-shadow:var(--shadow);
}

.art-tag b{
  display:block;

  color:var(--cyan);

  margin-bottom:4px;
}

.art-tag small{
  color:var(--muted);

  line-height:1.45;
}


/* =========================
   GENERAL SECTIONS
========================= */

.section{
  position:relative;

  padding:
    100px
    6vw;
}

.section-inner{
  width:min(
    1180px,
    100%
  );

  margin:auto;
}

.section-heading{
  display:flex;

  align-items:end;

  justify-content:space-between;

  gap:20px;

  margin-bottom:35px;
}

.kicker{
  color:var(--cyan);

  font-size:.76rem;

  font-weight:900;

  letter-spacing:1.7px;

  text-transform:uppercase;
}

.section h2{
  font-size:
    clamp(
      2rem,
      4vw,
      3.2rem
    );

  margin:
    7px 0 0;

  letter-spacing:-.04em;
}

.section-intro{
  max-width:650px;

  color:var(--muted);

  line-height:1.7;
}

.panel{
  background:
    linear-gradient(
      145deg,
      rgba(17,24,65,.88),
      rgba(7,11,34,.86)
    );

  border:
    1px solid
    var(--line);

  border-radius:
    var(--radius);

  box-shadow:
    var(--shadow);

  backdrop-filter:blur(12px);
}


/* =========================
   MAIN CREW
========================= */

.crew-showcase{
  display:grid;

  grid-template-columns:
    1.05fr
    1.5fr;

  gap:22px;

  padding:24px;
}

.crew-feature{
  position:relative;

  overflow:hidden;

  min-height:430px;

  border-radius:21px;

  padding:25px;

  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(92,157,255,.18),
      transparent 45%
    ),
    rgba(4,7,27,.5);

  border:
    1px solid
    rgba(126,151,255,.12);
}

.crew-feature h3{
  font-size:1.7rem;

  margin:
    0 0 5px;
}

.crew-feature p{
  color:var(--muted);

  line-height:1.6;
}

.crew-feature img{
  width:230px;

  margin:
    15px auto 0;

  filter:
    drop-shadow(
      0 18px 24px
      rgba(0,0,0,.4)
    );
}

.crew-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:12px;
}

.member{
  position:relative;

  padding:
    15px 10px;

  border-radius:19px;

  text-align:center;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(126,151,255,.13);

  transition:.25s ease;

  overflow:hidden;
}

.member:hover{
  transform:translateY(-6px);

  background:
    rgba(92,157,255,.08);

  border-color:
    rgba(85,216,255,.32);
}

.member img{
  height:145px;

  width:100%;

  object-fit:contain;

  margin:auto;

  filter:
    drop-shadow(
      0 10px 14px
      rgba(0,0,0,.35)
    );
}

.member strong{
  display:block;

  margin-top:8px;
}

.member p{
  margin:
    4px 0 0;

  color:var(--muted);

  font-size:.76rem;

  line-height:1.35;
}


/* =========================
   SPACE FRIENDS
========================= */

.friends-wrap{
  display:grid;

  grid-template-columns:
    .9fr
    1.4fr;

  gap:22px;

  align-items:stretch;
}

.friends-art{
  padding:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;
}

.friends-art img{
  width:100%;

  max-height:470px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 25px 35px
      rgba(0,0,0,.45)
    );
}

.friend-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:12px;
}

.friend{
  padding:
    12px 8px;

  border-radius:18px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(126,151,255,.13);

  text-align:center;

  transition:.22s;
}

.friend:hover{
  transform:translateY(-5px);

  border-color:
    rgba(168,124,255,.4);
}

.friend img{
  height:105px;

  width:100%;

  object-fit:contain;
}

.friend strong{
  font-size:.84rem;
}

.friend span{
  display:block;

  color:var(--muted);

  font-size:.68rem;

  margin-top:3px;
}
  /* =========================
   MISSION HUB
========================= */

.mission-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;
}

.mission-card{
  position:relative;

  min-height:230px;

  padding:22px;

  overflow:hidden;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(18,26,72,.9),
      rgba(7,11,35,.92)
    );

  border:
    1px solid
    rgba(126,151,255,.16);

  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.mission-card:hover{
  transform:translateY(-8px);

  border-color:
    rgba(85,216,255,.38);

  box-shadow:
    0 22px 55px
    rgba(0,0,0,.32),
    0 0 35px
    rgba(85,216,255,.08);
}

.mission-card:before{
  content:"";

  position:absolute;

  width:130px;
  height:130px;

  right:-55px;
  top:-55px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(168,124,255,.22),
      transparent 68%
    );
}

.mission-number{
  width:39px;
  height:39px;

  display:grid;

  place-items:center;

  border-radius:13px;

  background:
    rgba(85,216,255,.09);

  border:
    1px solid
    rgba(85,216,255,.2);

  color:var(--cyan);

  font-weight:1000;

  font-size:.8rem;
}

.mission-card h3{
  margin:
    22px 0 7px;

  font-size:1.25rem;
}

.mission-card p{
  color:var(--muted);

  font-size:.88rem;

  line-height:1.55;

  margin:0;
}

.mission-link{
  display:inline-flex;

  align-items:center;

  gap:7px;

  margin-top:18px;

  color:var(--cyan);

  font-size:.82rem;

  font-weight:900;
}


/* =========================
   GAMES
========================= */

.games-shell{
  padding:26px;
}

.game-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:14px;
}

.game-card{
  position:relative;

  padding:19px;

  min-height:205px;

  border-radius:20px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(126,151,255,.15);

  overflow:hidden;

  transition:.24s ease;
}

.game-card:hover{
  transform:
    translateY(-6px)
    scale(1.01);

  border-color:
    rgba(85,216,255,.35);
}

.game-icon{
  width:50px;
  height:50px;

  display:grid;

  place-items:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      rgba(85,216,255,.16),
      rgba(168,124,255,.16)
    );

  border:
    1px solid
    rgba(126,151,255,.18);

  color:var(--cyan);

  font-weight:1000;

  font-size:1.05rem;
}

.game-card h3{
  margin:
    17px 0 7px;

  font-size:1.05rem;
}

.game-card p{
  color:var(--muted);

  font-size:.78rem;

  line-height:1.5;

  min-height:48px;
}

.game-card button{
  width:100%;

  margin-top:10px;

  border:1px solid
    rgba(85,216,255,.18);

  background:
    rgba(85,216,255,.07);

  color:var(--cyan);

  border-radius:12px;

  padding:9px;

  font-weight:900;

  cursor:pointer;

  transition:.2s;
}

.game-card button:hover{
  background:
    rgba(85,216,255,.15);
}


/* =========================
   GENERIC GAME PANEL
========================= */

#gamePanel{
  margin-top:18px;

  padding:24px;

  display:none;
}

#gamePanel.active{
  display:block;
}

.game-panel-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-bottom:20px;
}

.game-panel-head h3{
  margin:0;
}

.close-btn{
  border:1px solid
    var(--line);

  background:
    rgba(255,255,255,.05);

  color:var(--white);

  border-radius:11px;

  padding:8px 12px;

  cursor:pointer;
}


/* =========================
   MUSIC
========================= */

.music-layout{
  display:grid;

  grid-template-columns:
    .75fr
    1.4fr;

  gap:20px;
}

.song-list{
  display:flex;

  flex-direction:column;

  gap:9px;

  max-height:560px;

  overflow:auto;

  padding:7px;
}

.song-item{
  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  border-radius:15px;

  border:
    1px solid
    rgba(126,151,255,.12);

  background:
    rgba(255,255,255,.025);

  cursor:pointer;

  transition:.2s;
}

.song-item:hover,
.song-item.active{
  background:
    rgba(85,216,255,.08);

  border-color:
    rgba(85,216,255,.28);
}

.song-number{
  width:34px;
  height:34px;

  flex:none;

  display:grid;

  place-items:center;

  border-radius:10px;

  background:
    rgba(168,124,255,.12);

  color:var(--purple);

  font-weight:900;

  font-size:.78rem;
}

.song-info{
  min-width:0;
}

.song-info strong{
  display:block;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:.86rem;
}

.song-info span{
  color:var(--muted);

  font-size:.7rem;
}

.player{
  min-height:430px;

  padding:28px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  overflow:hidden;

  position:relative;
}

.player:before{
  content:"";

  position:absolute;

  width:330px;
  height:330px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(168,124,255,.16),
      transparent 68%
    );

  filter:blur(8px);
}

.player-cover{
  position:relative;

  width:190px;
  height:190px;

  border-radius:35px;

  background:
    linear-gradient(
      145deg,
      #15255f,
      #26145e
    );

  border:
    1px solid
    rgba(126,151,255,.25);

  display:grid;

  place-items:center;

  box-shadow:
    0 25px 55px
    rgba(0,0,0,.4);

  margin-bottom:25px;
}

.player-cover img{
  width:145px;

  filter:
    drop-shadow(
      0 12px 15px
      rgba(0,0,0,.4)
    );
}

.player h3{
  position:relative;

  margin:
    0 0 7px;
}

.player p{
  position:relative;

  color:var(--muted);

  margin:0;
}


/* =========================
   STORIES
========================= */

.story-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:17px;
}

.story-card{
  padding:22px;

  min-height:245px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(17,24,65,.9),
      rgba(7,11,34,.92)
    );

  border:
    1px solid
    rgba(126,151,255,.15);

  transition:.24s ease;
}

.story-card:hover{
  transform:translateY(-7px);

  border-color:
    rgba(255,127,215,.3);
}

.story-cover{
  height:115px;

  border-radius:16px;

  margin-bottom:16px;

  background:
    radial-gradient(
      circle at 70% 25%,
      rgba(255,127,215,.22),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #101d50,
      #241451
    );

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;
}

.story-cover img{
  height:130px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 12px 15px
      rgba(0,0,0,.4)
    );
}

.story-card h3{
  margin:
    0 0 7px;
}

.story-card p{
  color:var(--muted);

  line-height:1.5;

  font-size:.83rem;

  margin:0;
}

.level-badge{
  display:inline-block;

  margin-top:13px;

  padding:
    5px 9px;

  border-radius:999px;

  background:
    rgba(111,240,193,.08);

  border:
    1px solid
    rgba(111,240,193,.18);

  color:var(--green);

  font-size:.68rem;

  font-weight:900;
}

#storyPanel{
  margin-top:18px;

  padding:25px;

  display:none;
}

#storyPanel.active{
  display:block;
}


/* =========================
   GRAMMAR
========================= */

.grammar-box{
  padding:30px;

  max-width:900px;

  margin:auto;
}

.grammar-progress{
  display:flex;

  justify-content:space-between;

  gap:15px;

  margin-bottom:22px;

  color:var(--muted);

  font-size:.8rem;
}

.progress-bar{
  height:8px;

  border-radius:999px;

  overflow:hidden;

  background:
    rgba(255,255,255,.07);

  margin-bottom:28px;
}

.progress-fill{
  height:100%;

  width:0;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      var(--blue),
      var(--purple),
      var(--pink)
    );

  transition:
    width .35s ease;
}

#grammarQuestion{
  font-size:
    clamp(
      1.2rem,
      2.5vw,
      1.65rem
    );

  line-height:1.5;

  margin-bottom:22px;
}

.grammar-options{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;
}

.grammar-option{
  padding:
    15px 17px;

  border-radius:15px;

  border:
    1px solid
    rgba(126,151,255,.15);

  background:
    rgba(255,255,255,.035);

  color:var(--white);

  cursor:pointer;

  text-align:left;

  transition:.2s;
}

.grammar-option:hover{
  border-color:
    rgba(85,216,255,.35);

  background:
    rgba(85,216,255,.06);
}

.grammar-option.correct{
  border-color:
    rgba(111,240,193,.5);

  background:
    rgba(111,240,193,.09);
}

.grammar-option.wrong{
  border-color:
    rgba(255,127,215,.5);

  background:
    rgba(255,127,215,.08);
}


/* =========================
   VOCABULARY
========================= */

.vocab-layout{
  display:grid;

  grid-template-columns:
    .7fr
    1.3fr;

  gap:20px;
}

.vocab-tools{
  padding:25px;
}

.vocab-tools h3{
  margin-top:0;
}

.vocab-tools input{
  width:100%;

  padding:
    13px 14px;

  border-radius:13px;

  border:
    1px solid
    rgba(126,151,255,.18);

  background:
    rgba(255,255,255,.04);

  color:var(--white);

  outline:none;
}

.vocab-tools input:focus{
  border-color:
    rgba(85,216,255,.45);
}

.vocab-list{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  padding:22px;
}

.word-card{
  padding:
    14px;

  border-radius:15px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(126,151,255,.12);
}

.word-card strong{
  display:block;

  color:var(--cyan);

  margin-bottom:4px;
}

.word-card span{
  color:var(--muted);

  font-size:.78rem;
}


/* =========================
   LEVELS
========================= */

.level-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:15px;
}

.level-card{
  position:relative;

  min-height:250px;

  padding:22px;

  border-radius:22px;

  overflow:hidden;

  background:
    linear-gradient(
      160deg,
      rgba(17,24,65,.92),
      rgba(6,9,31,.94)
    );

  border:
    1px solid
    rgba(126,151,255,.16);

  transition:.25s ease;
}

.level-card:hover{
  transform:
    translateY(-7px);

  border-color:
    rgba(85,216,255,.32);
}

.level-card:nth-child(1){
  box-shadow:
    inset 0 -70px 100px
    rgba(85,216,255,.05);
}

.level-card:nth-child(2){
  box-shadow:
    inset 0 -70px 100px
    rgba(168,124,255,.06);
}

.level-card:nth-child(3){
  box-shadow:
    inset 0 -70px 100px
    rgba(255,127,215,.06);
}

.level-card:nth-child(4){
  box-shadow:
    inset 0 -70px 100px
    rgba(111,240,193,.05);
}

.level-card:nth-child(5){
  box-shadow:
    inset 0 -70px 100px
    rgba(255,215,107,.05);
}

.level-orb{
  width:64px;
  height:64px;

  border-radius:50%;

  display:grid;

  place-items:center;

  margin-bottom:22px;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.32),
      rgba(85,216,255,.18) 28%,
      rgba(168,124,255,.13) 65%,
      transparent 70%
    );

  border:
    1px solid
    rgba(126,151,255,.18);

  font-weight:1000;
}

.level-card h3{
  margin:
    0 0 5px;
}

.level-card p{
  color:var(--muted);

  font-size:.8rem;

  line-height:1.5;
}

.level-card button{
  margin-top:12px;

  border:0;

  background:none;

  color:var(--cyan);

  font-weight:900;

  cursor:pointer;

  padding:0;
}


/* =========================
   FOOTER
========================= */

.footer{
  padding:
    65px 6vw 35px;

  border-top:
    1px solid
    rgba(126,151,255,.12);

  background:
    rgba(2,4,17,.78);
}

.footer-inner{
  width:min(
    1180px,
    100%
  );

  margin:auto;

  display:flex;

  justify-content:space-between;

  gap:25px;

  align-items:flex-start;
}

.footer-brand{
  max-width:420px;
}

.footer-brand h3{
  margin:0 0 8px;

  font-size:1.4rem;
}

.footer-brand p{
  color:var(--muted);

  line-height:1.6;

  font-size:.84rem;
}

.footer-links{
  display:flex;

  gap:12px;

  flex-wrap:wrap;
}

.footer-links a{
  color:var(--muted);

  font-size:.8rem;
}

.footer-links a:hover{
  color:var(--cyan);
}

.footer-bottom{
  width:min(
    1180px,
    100%
  );

  margin:
    35px auto 0;

  padding-top:20px;

  border-top:
    1px solid
    rgba(126,151,255,.09);

  color:
    rgba(174,184,217,.65);

  font-size:.72rem;

  display:flex;

  justify-content:space-between;

  gap:15px;
}


/* =========================
   NOTIFICATION
========================= */

#toast{
  position:fixed;

  z-index:200;

  right:20px;
  bottom:20px;

  max-width:350px;

  padding:
    14px 17px;

  border-radius:15px;

  background:
    rgba(7,10,33,.94);

  border:
    1px solid
    rgba(85,216,255,.25);

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.4);

  color:var(--white);

  transform:
    translateY(20px);

  opacity:0;

  pointer-events:none;

  transition:.25s ease;
}

#toast.show{
  transform:
    translateY(0);

  opacity:1;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes float{
  0%,100%{
    transform:
      translateY(0)
      rotate(0deg);
  }

  50%{
    transform:
      translateY(-18px)
      rotate(3deg);
  }
}

@keyframes rocketFloat{
  0%,100%{
    transform:
      translateY(0)
      rotate(-18deg);
  }

  50%{
    transform:
      translateY(-15px)
      rotate(-13deg);
  }
}

@keyframes heroFloat{
  0%,100%{
    transform:
      translateY(0);
  }

  50%{
    transform:
      translateY(-10px);
  }
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

  .hero-grid{
    grid-template-columns:
      1fr;
  }

  .hero-copy{
    max-width:800px;

    margin:auto;

    text-align:center;
  }

  .hero-actions,
  .hero-stats{
    justify-content:center;
  }

  .hero-art{
    min-height:470px;
  }

  .crew-showcase{
    grid-template-columns:1fr;
  }

  .friends-wrap{
    grid-template-columns:1fr;
  }

  .mission-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .game-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .level-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .music-layout,
  .vocab-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:760px){

  .nav-links{
    display:none;

    position:absolute;

    top:66px;
    left:0;
    right:0;

    padding:10px;

    flex-direction:column;

    background:
      rgba(4,7,27,.96);

    border:
      1px solid
      rgba(126,151,255,.18);

    border-radius:18px;
  }

  .nav-links.open{
    display:flex;
  }

  .nav-links a{
    width:100%;

    text-align:center;
  }

  .nav-cta{
    display:none;
  }

  .nav-toggle{
    display:block;

    margin-left:auto;
  }

  .hero{
    padding-top:125px;
  }

  .hero h1{
    font-size:
      clamp(
        3.8rem,
        20vw,
        6rem
      );
  }

  .hero-art{
    min-height:350px;
  }

  .main-art{
    width:95%;
  }

  .earth{
    width:100px;
    left:-10%;
  }

  .purple-planet{
    width:90px;
    right:-5%;
  }

  .moon{
    width:65px;
    right:0;
  }

  .pink-planet,
  .orange-planet{
    display:none;
  }

  .rocket-bg{
    width:90px;
    left:0;
  }

  .section{
    padding:
      75px 5vw;
  }

  .section-heading{
    align-items:flex-start;

    flex-direction:column;
  }

  .crew-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .friend-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .mission-grid,
  .game-grid,
  .story-grid{
    grid-template-columns:
      1fr;
  }

  .level-grid{
    grid-template-columns:
      1fr;
  }

  .grammar-options{
    grid-template-columns:
      1fr;
  }

  .vocab-list{
    grid-template-columns:
      repeat(2,1fr);
  }

  .footer-inner,
  .footer-bottom{
    flex-direction:column;
  }

  .art-tag{
    right:5%;
  }
}

@media(max-width:450px){

  .nav{
    top:8px;

    width:
      calc(100% - 16px);
  }

  .hero{
    padding:
      110px 18px 70px;
  }

  .hero h1{
    font-size:3.5rem;
  }

  .hero-stats{
    display:grid;

    grid-template-columns:
      repeat(2,1fr);

    width:100%;
  }

  .stat{
    min-width:0;
  }

  .crew-grid{
    grid-template-columns:
      1fr 1fr;
  }

  .member img{
    height:120px;
  }

  .vocab-list{
    grid-template-columns:
      1fr;
  }

  .games-shell{
    padding:16px;
  }

  .grammar-box{
    padding:20px;
  }
}

}

let grammarIndex = 0;
let grammarScore = 0;


function renderGrammarQuestion() {

  const question =
    grammarQuestions[grammarIndex];

  const questionElement =
    document.getElementById(
      "grammarQuestion"
    );

  const optionsElement =
    document.getElementById(
      "grammarOptions"
    );

  const counter =
    document.getElementById(
      "grammarCounter"
    );

  const score =
    document.getElementById(
      "grammarScore"
    );

  const progress =
    document.getElementById(
      "grammarProgress"
    );

  if (
    !question ||
    !questionElement ||
    !optionsElement
  ) {
    return;
  }

  questionElement.textContent =
    question.question;

  optionsElement.innerHTML = "";

  question.options.forEach(option => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "grammar-option";

    button.textContent =
      option;

    button.addEventListener(
      "click",
      () => answerGrammar(
        option,
        button
      )
    );

    optionsElement.appendChild(button);

  });

  if (counter) {
    counter.textContent =
      `Pregunta ${grammarIndex + 1} de ${grammarQuestions.length}`;
  }

  if (score) {
    score.textContent =
      `Puntos: ${grammarScore}`;
  }

  if (progress) {

    const percentage =
      (
        grammarIndex /
        grammarQuestions.length
      ) * 100;

    progress.style.width =
      `${percentage}%`;

  }

}


function answerGrammar(
  answer,
  clickedButton
) {

  const question =
    grammarQuestions[grammarIndex];

  const buttons =
    document.querySelectorAll(
      ".grammar-option"
    );

  buttons.forEach(button => {
    button.disabled = true;
  });

  if (answer === question.answer) {

    clickedButton.classList.add(
      "correct"
    );

    grammarScore++;

    notify("¡Respuesta correcta!");

  } else {

    clickedButton.classList.add(
      "wrong"
    );

    buttons.forEach(button => {

      if (
        button.textContent ===
        question.answer
      ) {
        button.classList.add(
          "correct"
        );
      }

    });

    notify(
      `La respuesta correcta es: ${question.answer}`
    );

  }

  setTimeout(() => {

    grammarIndex++;

    if (
      grammarIndex >=
      grammarQuestions.length
    ) {

      finishGrammar();

    } else {

      renderGrammarQuestion();

    }

  }, 900);

}


function finishGrammar() {

  const questionElement =
    document.getElementById(
      "grammarQuestion"
    );

  const optionsElement =
    document.getElementById(
      "grammarOptions"
    );

  const progress =
    document.getElementById(
      "grammarProgress"
    );

  const counter =
    document.getElementById(
      "grammarCounter"
    );

  const score =
    document.getElementById(
      "grammarScore"
    );

  const percentage =
    Math.round(
      (
        grammarScore /
        grammarQuestions.length
      ) * 100
    );

  if (questionElement) {

    questionElement.innerHTML = `
      <strong>
        ¡Misión de gramática completada!
      </strong>

      <p style="
        color:var(--muted);
        line-height:1.7;
      ">
        Obtuviste ${grammarScore}
        de ${grammarQuestions.length}
        respuestas correctas.
      </p>

      <p style="
        color:var(--cyan);
        font-weight:900;
      ">
        Resultado: ${percentage}%
      </p>
    `;

  }

  if (optionsElement) {

    optionsElement.innerHTML = `

      <button
        class="btn"
        type="button"
        onclick="restartGrammar()"
      >
        Volver a intentar
      </button>

    `;

  }

  if (progress) {
    progress.style.width = "100%";
  }

  if (counter) {
    counter.textContent =
      "Misión completada";
  }

  if (score) {
    score.textContent =
      `Puntos: ${grammarScore}`;
  }

}


function restartGrammar() {

  grammarIndex = 0;

  grammarScore = 0;

  renderGrammarQuestion();

}

function renderVocabulary(
  filter = ""
) {

  const list =
    document.getElementById(
      "vocabList"
    );

  if (!list) return;

  const normalized =
    filter
      .toLowerCase()
      .trim();

  const filtered =
    vocabulary.filter(item => {

      return (
        item[0]
          .toLowerCase()
          .includes(normalized)
        ||
        item[1]
          .toLowerCase()
          .includes(normalized)
      );

    });

  list.innerHTML = "";

  if (!filtered.length) {

    list.innerHTML = `

      <div style="
        grid-column:1/-1;
        color:var(--muted);
        text-align:center;
        padding:30px;
      ">
        No se encontró esa palabra.
      </div>

    `;

    return;
  }

  filtered.forEach(word => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "word-card";

    card.innerHTML = `

      <strong>
        ${word[0]}
      </strong>

      <span>
        ${word[1]}
      </span>

    `;

    list.appendChild(card);

  });

}

/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveProgress(
  key,
  value
) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  } catch(error) {

    console.warn(
      "No fue posible guardar el progreso.",
      error
    );

  }

}


function loadProgress(
  key,
  fallback = null
) {

  try {

    const value =
      localStorage.getItem(key);

    return value
      ? JSON.parse(value)
      : fallback;

  } catch(error) {

    return fallback;

  }

}

/* =====================================================
   EFECTO DE SCROLL PARA NAVBAR
===================================================== */

let lastScroll = 0;

window.addEventListener(
  "scroll",
  () => {

    const current =
      window.scrollY;

    const navbar =
      document.querySelector(".nav");

    if (!navbar) return;

    if (current > lastScroll && current > 120) {

      navbar.style.transform =
        "translate(-50%, -110%)";

    } else {

      navbar.style.transform =
        "translate(-50%, 0)";

    }

    lastScroll = current;

  },
  { passive:true }
);
